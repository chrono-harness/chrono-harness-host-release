[package]
name = "chrono-host-release-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
sha2 = "0.10"
tempfile = "3"
vstd = "=0.0.0-2026-04-20-1748"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono-host-release = { path = "../host-release" }

[[test]]
name = "identity"
path = "tests/identity.rs"

[[test]]
name = "registrations"
path = "tests/registrations.rs"

[[test]]
name = "originals"
path = "tests/originals.rs"

[[bin]]
name = "chrono-release-query-mock"
path = "tests/query_tool.rs"
test = false
bench = false

[[example]]
name = "release_observation"
path = "tests/proof_support/host-release/support/release_tool.rs"
